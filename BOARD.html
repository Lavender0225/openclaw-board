<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>任务看板 - BOARD</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    padding: 20px;
    line-height: 1.6;
}
.container { max-width: 1200px; margin: 0 auto; }
h1 { color: #f0f6fc; margin-bottom: 20px; font-size: 24px; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
h2 { color: #f0f6fc; margin: 25px 0 15px; font-size: 18px; }
h3 { color: #8b949e; font-size: 14px; text-transform: uppercase; margin-bottom: 10px; }

table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
th, td { padding: 12px; text-align: left; border: 1px solid #30363d; }
th { background: #161b22; color: #f0f6fc; font-weight: 600; }
tr:nth-child(even) { background: #161b22; }

/* 状态标签 */
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.status-green { background: #238636; }
.status-blue { background: #1f6feb; }
.status-red { background: #da3633; }
.status-yellow { background: #d29922; }
.status-gray { background: #484f58; }

/* 页脚 */
.footer { margin-top: 30px; padding-top: 15px; border-top: 1px solid #30363d; font-size: 12px; color: #8b949e; text-align: center; }
.timestamp { color: #58a6ff; }
</style>

</head>
<body>
<div class="container">
<h1>📋 任务看板</h1>
<h2>🤖 Agent 状态</h2>
<table><thead><tr><th>Agent</th><th>角色</th><th>最后活跃</th><th>状态</th></tr></thead><tbody><tr><td>总管 (main)</td><td>协调调度</td><td>4/13 09:30</td><td>✅ 活跃</td></tr><tr><td>干活牛马 (worker)</td><td>代码执行</td><td>4/13 cron</td><td>✅ 待命</td></tr><tr><td>调研牛马 (research)</td><td>技术调研</td><td>4/13 09:23</td><td>✅ 刚完成 Hermes 深度调研</td></tr><tr><td>设计牛马 (designer)</td><td>方案设计</td><td>4/13 07:50</td><td>✅ 待命</td></tr><tr><td>总结牛马 (summarizer)</td><td>总结汇报</td><td>4/13 cron</td><td>✅ 待命</td></tr></tbody></table>
<div class="footer">
最后更新: <span class="timestamp">2026-04-13 09:41:02</span>
</div>
</div>
</body>
</html>
